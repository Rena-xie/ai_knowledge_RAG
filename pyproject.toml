[project]
name = "ai-knowledge-base"
version = "0.1.0"
description = "面向个人 AI 学习的网页知识采集、混合检索与有据问答系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jieba>=0.42.1",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "trafilatura>=1.12",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
