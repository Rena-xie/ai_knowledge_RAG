[project]
name = "ai-knowledge-rag"
version = "2.0.0"
description = "面向个人 AI 学习的网页知识采集、混合检索与有据问答系统"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jieba>=0.42.1",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "trafilatura>=1.12",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
files = ["app", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["jieba", "jieba.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
