name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装 uv
        # 固定到 v10.3.0 的 commit SHA：setup-uv 仓库没有 v10 浮动 tag，
        # 写 @v10 会导致 "unable to find version v10"。
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: 安装依赖（按 uv.lock 锁定版本）
        run: uv sync --frozen
      - name: 静态检查（ruff）
        run: uv run ruff check .
      - name: 类型检查（mypy）
        run: uv run mypy
      - name: 测试与覆盖率（pytest）
        run: uv run pytest --cov --cov-report=term-missing
